services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-uniformes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniformes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: controle_uniformes
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - uniformes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniformes -d controle_uniformes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uniformes_postgres_data:
